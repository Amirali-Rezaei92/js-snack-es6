<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Weight Manager | Lightest Item Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles/style.css" rel="stylesheet">
</head>

<body class="bg-light ">

    <div class="container py-4 py-md-5 border mt-5 rounded-3 shadow-sm bg-white">

        <div class="row g-4">


            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"> ➕Aggiungi nuovo elemento</h5>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <div class="mb-3">
                            <label for="nomeInput" class="form-label fw-semibold">NOME</label>
                            <input type="text" class="form-control" id="nomeInput" placeholder="insersci nome di bicicletta">
                        </div>
                        <div class="mb-4">
                            <label for="pesoInput" class="form-label fw-semibold">PESO (kg)</label>
                            <input type="number" class="form-control" id="pesoInput" step="any"
                                placeholder="inserisci peso" >
                        </div>
                        <div class="d-flex justify-content-start mt-auto">
                            <button id="addItemBtn" class="btn btn-primary px-4 py-2 fw-semibold">aggiungi elemento</button>
                        </div>
                        <div class="small text-muted mt-3 d-flex flex-wrap gap-2">
                            <span>** Massimo 5 elementi **</span>
                        </div>
                    </div>
                </div>
            </div>


            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap">
                        <h5 class="mb-0">📋 Lista elementi</h5>
                        <span class="badge bg-secondary rounded-pill" id="itemCounterBadge">0 / 5</span>
                    </div>
                    <div class="card-body p-0">
                        <div id="itemsContainer" class="list-group-flush">
                            <div class="text-muted text-center p-4">non ci sono elementi</div>
                        </div>
                    </div>
                    <div class="card-footer bg-white text-muted small">
                        Ogni elemento ha un pulsante <strong>REMOVE</strong>  fai clic per eliminarlo..
                    </div>
                </div>
            </div>
        </div>


        <div class="row mt-5 mx-auto">
            <hr>
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"> Compare & find lightest</h5>
                    </div>
                    <div
                        class="card-body d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
                        <button id="findLightestBtn"
                            class="btn btn-success btn-lg px-4 py-2 fw-semibold d-inline-flex align-items-center gap-2">
                            🔍 FIND LIGHTEST ITEM
                        </button>
                        <div id="lightestResultArea"
                            class="alert alert-info mb-0 w-100 w-md-auto bg-light border-0 text-dark fw-medium"
                            style="min-width: 200px;">
                            📌 Click the button to see the lightest item
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="./scripts/index2.js" defer></script>
</body>

</html>
